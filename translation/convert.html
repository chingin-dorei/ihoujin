<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update a translation file</title>
<style>
:root { --bg: #14161d; --panel: #1c1f29; --line: #2e3242; --text: #e6e1d2; --dim: #9a9585; --gold: #e3b866; --ok: #7fd08a; --ng: #ef7b6f; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }
h1 { font: 23px "Yu Mincho", "Hiragino Mincho ProN", serif; color: var(--gold); margin: 0 0 6px; }
h2 { font-size: 17px; color: var(--gold); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin: 28px 0 10px; }
a { color: var(--gold); } .dim { color: var(--dim); font-size: 13px; } .ng { color: var(--ng); } [hidden] { display: none !important; }
button, .pick { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
button:hover, .pick:hover { border-color: var(--gold); } button:disabled { opacity: .5; cursor: default; }
.main { border-color: var(--gold); color: var(--gold); }
.pick { display: inline-block; } .pick input { position: absolute; opacity: 0; width: 1px; height: 1px; } .pick:focus-within { outline: 2px solid var(--gold); }
#lang { float: right; padding: 2px 10px; font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.tiles div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; } .tiles b { display: block; font-size: 22px; line-height: 1.3; color: var(--gold); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; overflow-wrap: anywhere; } .card.done { border-color: var(--ok); }
.card p { margin: 0 0 4px; white-space: pre-wrap; } .card p > span:first-child { color: var(--dim); font-size: 12px; margin-right: 8px; }
del { background: #6b2a2a; text-decoration: line-through; } ins { background: #23552f; text-decoration: none; }
textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 4px 0 6px; resize: vertical; }
label { cursor: pointer; }
</style></head><body><main>
<button id="lang"></button>
<h1 data-t="title"></h1>
<p data-t="lead"></p>
<p class="dim" data-t="local"></p>
<h2 data-t="step1"></h2>
<p id="tplinfo" class="dim"></p>
<p><label class="pick main"><span data-t="pick"></span><input type="file" id="old" accept=".json,application/json"></label>
<label class="pick"><span data-t="picktpl"></span><input type="file" id="tpl" accept=".json,application/json"></label></p>
<p id="err" class="ng" role="alert"></p>
<div id="result" hidden>
<h2 data-t="step2"></h2>
<div class="tiles" id="tiles"></div>
<p id="progress"></p>
<div id="revbox"><h2><span data-t="step3"></span> <span id="revn"></span></h2>
<p class="dim" data-t="revnote"></p>
<p><button id="minor"></button></p><div id="review"></div><button id="more"></button></div>
<details id="badbox"><summary id="badn"></summary><div id="bad"></div></details>
<h2 data-t="step4"></h2>
<p><label><input type="checkbox" id="keep"> <span data-t="keep"></span></label></p>
<p><button id="save" class="main" data-t="save"></button></p>
<p class="dim" data-t="after"></p>
</div>
<p><a href="./" data-t="back"></a></p>
</main>
<script src="convert.js"></script>
<script>
const TX = {
  en: { title: 'Update a translation file', lead: 'Move a translation made for an older version of the game onto the newest text list. Unfinished files are fine.', local: 'Everything happens inside your browser. Your file is not uploaded anywhere.',
    step1: '1. Choose your translation file', pick: '📂 Choose your .json file', picktpl: 'Use another template.json', tplv: (v, n) => `New text list: ver ${v} (${n} texts)`, notpl: 'The new text list could not be loaded. Choose the template.json from the newest kit.', loading: 'Loading the new text list…',
    badold: 'This is not a translation file for this game.', badtpl: 'This is not a template.json.',
    step2: '2. Result', same: 'carried over', blank: 'still empty', new: 'new texts', review: 'to check', removed: 'no longer used', progress: (a, b) => `Translated: ${a} / ${b} (${Math.floor(a / b * 100)}%)`,
    step3: '3. Check changed texts', revnote: 'The Japanese text was changed. Nothing is filled in until you choose to use it. Anything you leave stays untranslated, and is kept in the saved file so you can come back to it here later.',
    minor: (n) => `Use all where only punctuation or spaces changed (${n})`, was: 'old', now: 'new', use: 'Use this', undo: 'Undo', more: (n) => `Show more (${n} left)`, warn: (x) => `Placeholders or tags do not match: ${x}`,
    badn: (n) => `⚠ Translations whose placeholders or tags do not match the Japanese: ${n}`, badtr: 'translation',
    step4: '4. Save the updated file', keep: 'Keep translations of texts that are no longer used active (only if you added your own entries)', save: '💾 Save the updated file', after: 'Load the saved file in the game with the globe button (🌐) on the title screen.', back: '← Translation kit', other: '日本語' },
  ja: { title: '翻訳ファイルを新しい版へ移す', lead: '古い版で作った翻訳を、最新の文の一覧へ移します。作り途中のファイルでも使えます。', local: '処理はすべてブラウザの中で行います。ファイルはどこにも送信しません。',
    step1: '1. 翻訳ファイルを選ぶ', pick: '📂 翻訳ファイル（.json）を選ぶ', picktpl: '別の template.json を使う', tplv: (v, n) => `新しい文の一覧：ver ${v}（${n}文）`, notpl: '新しい文の一覧を読み込めませんでした。最新のキットの template.json を選んでください。', loading: '新しい文の一覧を読み込んでいます…',
    badold: 'このゲームの翻訳ファイルではないようです。', badtpl: 'template.json ではないようです。',
    step2: '2. 結果', same: '引き継ぎ', blank: '空欄のまま', new: '新規', review: '要確認', removed: '廃止', progress: (a, b) => `訳済み：${a} / ${b}（${Math.floor(a / b * 100)}%）`,
    step3: '3. 書き換わった文を確かめる', revnote: '日本語の原文が書き換わった文です。「この訳を使う」を押すまでは空欄のままです。残した分も保存したファイルに記録されるので、あとでここへ読み込めば続きから確かめられます。',
    minor: (n) => `句読点・空白だけの変更は、まとめて使う（${n}件）`, was: '古い原文', now: '新しい原文', use: 'この訳を使う', undo: '取り消す', more: (n) => `もっと見る（残り${n}件）`, warn: (x) => `{0} やタグが原文と合っていません：${x}`,
    badn: (n) => `⚠ {0} やタグが原文と合っていない訳：${n}件`, badtr: '訳',
    step4: '4. 新しい版のファイルを保存する', keep: '廃止された文の訳も有効なまま残す（自分で文を足した場合だけ）', save: '💾 新しい版のファイルを保存する', after: '保存したファイルは、ゲームの表題の画面の 🌐 から読み込めます。', back: '← 翻訳ツール', other: 'English' },
};
let L = /^ja/.test(navigator.language) ? 'ja' : 'en', tpl = null, tplErr = '', old = null, res = null, shown = 0;
const $ = (s) => document.querySelector(s), t = (k, ...a) => (typeof TX[L][k] === 'function' ? TX[L][k](...a) : TX[L][k]);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const line = (label, node) => { const p = el('p'); p.append(el('span', label), node); return p; };
const reviews = () => [...res.rows.values()].filter((r) => r.st === 'review');
function texts() {
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach((e) => (e.textContent = t(e.dataset.t)));
  $('#lang').textContent = t('other');
  $('#tplinfo').textContent = tpl ? t('tplv', tpl.version || '?', IJConvert.convert({ strings: {} }, tpl).stats.total) : t(tplErr || 'loading');
}
function sums() {
  const s = res.stats, left = reviews().filter((r) => !r.t).length, all = [...res.rows.values()];
  $('#tiles').replaceChildren(...[['same', s.same], ['review', left], ['new', s.new], ['blank', s.blank], ['removed', s.removed]].map(([k, n]) => { const d = el('div'); d.append(el('b', n), el('span', t(k), 'dim')); return d; }));
  $('#progress').textContent = t('progress', all.filter((r) => r.t).length, all.length);
  $('#revn').textContent = `(${left} / ${s.review})`;
  const m = reviews().filter((r) => r.minor && !r.t).length;
  $('#minor').textContent = t('minor', m); $('#minor').hidden = !m;
}
function card(r) {
  const c = el('div', null, 'card'), was = el('span'), now = el('span'), ta = el('textarea'), warn = el('p', null, 'ng'), b = el('button');
  for (const [k, x] of IJConvert.diff(r.from, r.ja)) { if (k <= 0) was.append(el(k ? 'del' : 'span', x)); if (k >= 0) now.append(el(k ? 'ins' : 'span', x)); }
  ta.value = r.t || r.edit || r.cand; ta.rows = Math.min(8, 1 + Math.floor(ta.value.length / 70) + (ta.value.match(/\n/g) || []).length);
  const upd = () => {
    const bad = IJConvert.markDiff(r.ja, ta.value);
    warn.textContent = bad.length ? t('warn', bad.join(' ')) : '';
    c.classList.toggle('done', !!r.t); ta.readOnly = !!r.t; b.textContent = t(r.t ? 'undo' : 'use'); b.disabled = !r.t && !ta.value;
  };
  ta.oninput = () => { r.edit = ta.value; upd(); };
  b.onclick = () => { r.t = r.t ? '' : ta.value; upd(); sums(); };
  c.append(line(t('was'), was), line(t('now'), now), ta, warn, b); upd();
  return c;
}
function cards(reset) {
  const list = reviews();
  if (reset) { shown = 0; $('#review').replaceChildren(); }
  const next = list.slice(shown, shown + 50);
  $('#review').append(...next.map(card)); shown += next.length;
  $('#more').hidden = shown >= list.length; $('#more').textContent = t('more', list.length - shown);
}
function draw() {
  $('#result').hidden = !res;
  if (!res) return;
  sums(); $('#revbox').hidden = !res.stats.review; cards(true);
  const bad = [...res.rows.values()].filter((r) => r.st === 'same' && r.bad && r.bad.length);
  $('#badbox').hidden = !bad.length; $('#badn').textContent = t('badn', bad.length);
  $('#bad').replaceChildren(...bad.slice(0, 300).map((r) => { const c = el('div', null, 'card'); c.append(line(t('now'), el('span', r.ja)), line(t('badtr'), el('span', r.t)), el('p', r.bad.join(' '), 'ng')); return c; }));
}
function run() {
  $('#err').textContent = ''; res = null;
  if (old && tpl) { try { res = IJConvert.convert(old, tpl); } catch (e) { $('#err').textContent = t('badold'); } }
  draw();
}
async function read(inp) { const f = inp.files[0]; inp.value = ''; return f ? JSON.parse((await f.text()).replace(/^﻿/, '')) : undefined; }
$('#old').onchange = async (ev) => {
  let o; try { o = await read(ev.target); } catch (e) { o = null; }
  if (o === undefined) return;
  old = o; run();
  if (!o) $('#err').textContent = t('badold'); else if (!tpl) $('#err').textContent = t(tplErr || 'loading');
};
$('#tpl').onchange = async (ev) => {
  let o; try { o = await read(ev.target); if (o !== undefined) IJConvert.convert({ strings: {} }, o); } catch (e) { $('#err').textContent = t('badtpl'); return; }
  if (o === undefined) return;
  tpl = o; texts(); run();
};
$('#more').onclick = () => cards(false);
$('#minor').onclick = () => { for (const r of reviews()) if (r.minor && !r.t) r.t = r.edit || r.cand; sums(); cards(true); };
$('#lang').onclick = () => { L = L === 'ja' ? 'en' : 'ja'; texts(); draw(); };
$('#save').onclick = () => {
  const out = IJConvert.build(res, { keepRemoved: $('#keep').checked }), a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
  a.download = `${String(out.code).replace(/[^\w-]/g, '') || 'translation'}${out.version ? '_v' + String(out.version).replace(/[^\w.]/g, '') : ''}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
texts();
fetch('template.json', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw 0; return r.json(); }).then((o) => { if (!tpl) { tpl = o; texts(); run(); } }, () => { if (!tpl) { tplErr = 'notpl'; texts(); } });
</script></body></html>
